name = "next-american-chapter"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "next-american-chapter"
database_id = "1a2dde92-d80f-4269-903d-7c0b3f1872d8"

[vars]
# Public Turnstile site key for the live site. Local dev overrides it with the always-pass test key in .dev.vars.
TURNSTILE_SITE_KEY = "0x4AAAAAAFan8SjxqatAyOf9"

# Secrets (wrangler secret put ...), never committed:
#   TURNSTILE_SECRET  Turnstile secret key
#   HASH_SALT         long random string; changing it resets everyone's "already voted" state
# For local dev they come from .dev.vars (see .dev.vars.example).
